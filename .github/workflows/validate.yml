name: Validate payment pipeline
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Configure isolated lab
        run: |
          python -c "import secrets; open('.env','w').write('POSTGRES_PASSWORD='+secrets.token_hex(24)+'\n')"
          mkdir -p artifacts
      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run end to end validation
        run: python scripts/validate.py 2>&1 | tee artifacts/validation.txt
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps > artifacts/services.txt
          docker compose logs --no-color jobmanager taskmanager > artifacts/flink.log
          curl -sf localhost:8082/jobs/overview > artifacts/jobs.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence
          path: artifacts/
      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
