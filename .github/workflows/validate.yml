name: Validate payment pipeline
on:
  push:
    paths:
      - '**'
      - '!README.md'
      - '!evidence/**'
      - '!docs/**'
      - '!schemas/alerts-*.avsc'
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Configure isolated lab
        run: |
          python -c "import secrets; open('.env','w').write('POSTGRES_PASSWORD='+secrets.token_hex(24)+'\n')"
          mkdir -p artifacts
      - name: Run setup and end to end validation
        run: ./setup.sh
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps > artifacts/services.txt
          docker compose logs --no-color jobmanager taskmanager > artifacts/flink.log
          docker compose --profile "*" logs --no-color iot-validator > artifacts/iot-validator.log
          docker compose --profile "*" logs --no-color iot-scorer > artifacts/iot-scorer.log
          curl -sf localhost:8082/jobs/overview > artifacts/jobs.json || true
          cp -r schemas artifacts/schemas
          curl -sf localhost:8083/connectors/payments-cdc/status > artifacts/connect-status.json || true
          curl -sf localhost:8083/connectors/iot-cdc/status > artifacts/iot-connect-status.json || true
      - name: Teardown
        if: always()
        run: ./teardown.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence
          path: artifacts/
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/cloud init -backend=false -input=false
      - run: terraform -chdir=infra/cloud fmt -check
      - run: terraform -chdir=infra/cloud validate -no-color
